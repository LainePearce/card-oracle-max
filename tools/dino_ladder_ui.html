<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DINOv2 Ladder Tuner</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #12151a; --panel: #1a1f27; --card: #222834; --border: #2e3644;
    --text: #dde3ec; --dim: #8b94a3; --accent: #4da3ff;
    --good: #2ecc71; --bad: #e74c3c; --warn: #f1c40f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px;
           background: var(--panel); border-bottom: 1px solid var(--border);
           position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .status { color: var(--dim); font-size: 12px; }
  header .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                background: var(--dim); margin-right: 5px; }
  header .dot.ok { background: var(--good); }
  header .dot.err { background: var(--bad); }
  .tabs { margin-left: auto; display: flex; gap: 8px; }
  .tabs button { background: var(--card); color: var(--text); border: 1px solid var(--border);
                 border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
  .tabs button.active { background: var(--accent); color: #04121f; border-color: var(--accent); }

  main { padding: 20px; max-width: 1500px; margin: 0 auto; }

  .querybar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
              background: var(--panel); border: 1px solid var(--border);
              border-radius: 8px; padding: 14px; margin-bottom: 18px; }
  .querybar input[type=text] { flex: 1 1 340px; background: var(--card); color: var(--text);
              border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
  .querybar label { color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 5px; }
  .querybar input[type=number] { width: 70px; background: var(--card); color: var(--text);
              border: 1px solid var(--border); border-radius: 6px; padding: 7px 8px; }
  .querybar select { background: var(--card); color: var(--text);
              border: 1px solid var(--border); border-radius: 6px; padding: 7px 8px; }
  #ladderInputs { display: flex; gap: 10px; align-items: center; }
  #ladderInputs input[type=number] { width: 76px; }
  .querybar button, .filebtn { background: var(--accent); color: #04121f; border: none;
              border-radius: 6px; padding: 8px 16px; font-weight: 600; cursor: pointer; }
  .filebtn { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .querybar button:disabled { opacity: .5; cursor: wait; }

  .queryimg { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 16px; }
  .queryimg img { max-height: 180px; border-radius: 8px; border: 1px solid var(--border); }
  .queryimg .meta { color: var(--dim); font-size: 12px; }
  .queryimg .meta b { color: var(--text); }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .cols.single { grid-template-columns: 1fr; }
  .col h2 { font-size: 14px; margin-bottom: 8px; color: var(--dim); font-weight: 600; }
  .col h2 span { color: var(--text); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }

  .rcard { background: var(--card); border: 2px solid var(--border); border-radius: 8px;
           overflow: hidden; position: relative; cursor: pointer; }
  .rcard img { width: 100%; height: 150px; object-fit: contain; background: #0c0e12; display: block; }
  .rcard .info { padding: 6px 8px; font-size: 11px; color: var(--dim); }
  .rcard .title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                  overflow: hidden; color: var(--text); margin-bottom: 3px; }
  .rcard .score { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.75);
                  color: #fff; font-size: 11px; font-weight: 700; padding: 2px 7px;
                  border-radius: 10px; }
  .rcard .rank { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.55);
                 color: var(--dim); font-size: 10px; padding: 2px 6px; border-radius: 10px; }
  .rcard.good { border-color: var(--good); }
  .rcard.bad  { border-color: var(--bad); opacity: .55; }
  .rcard .bnd { position: absolute; bottom: 34px; right: 6px; background: rgba(0,0,0,.65);
                color: var(--warn); border: 1px solid var(--warn); font-size: 10px;
                padding: 2px 6px; border-radius: 6px; opacity: 0; transition: opacity .15s; }
  .rcard:hover .bnd { opacity: 1; }

  .savebar { display: flex; gap: 12px; align-items: center; margin: 14px 0;
             background: var(--panel); border: 1px solid var(--border);
             border-radius: 8px; padding: 12px 14px; }
  .savebar .counts { color: var(--dim); font-size: 13px; }
  .savebar .counts b.g { color: var(--good); } .savebar .counts b.b { color: var(--bad); }
  .savebar button { background: var(--good); color: #04170c; border: none; border-radius: 6px;
                    padding: 8px 18px; font-weight: 700; cursor: pointer; }
  .savebar button:disabled { opacity: .4; cursor: default; }
  .savebar .hint { color: var(--dim); font-size: 12px; }
  .saved { color: var(--good); font-weight: 600; font-size: 13px; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
           padding: 16px; margin-bottom: 18px; }
  .panel h2 { font-size: 15px; margin-bottom: 10px; }
  .ladder { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 0 16px; }
  .ladder .step { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
                  padding: 12px 18px; text-align: center; }
  .ladder .step .v { font-size: 24px; font-weight: 700; color: var(--accent); }
  .ladder .step .k { font-size: 11px; color: var(--dim); margin-top: 3px; }
  .hist { display: flex; align-items: flex-end; gap: 2px; height: 120px; margin: 12px 0; }
  .hist .bucket { flex: 1; display: flex; align-items: flex-end; gap: 1px; height: 100%; position: relative; }
  .hist .bar { flex: 1; border-radius: 2px 2px 0 0; min-height: 1px; }
  .hist .bar.g { background: var(--good); } .hist .bar.b { background: var(--bad); }
  .histx { display: flex; color: var(--dim); font-size: 10px; }
  .histx span { flex: 1; text-align: center; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { border: 1px solid var(--border); padding: 5px 10px; text-align: right; }
  th { background: var(--card); color: var(--dim); }
  td.hl { background: rgba(77,163,255,.12); }
  .err { color: var(--bad); padding: 10px 0; }
  .dim { color: var(--dim); }
  .spin { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>DINOv2 Ladder Tuner</h1>
  <span class="status"><span class="dot" id="workerDot"></span><span id="workerTxt">checking worker…</span></span>
  <span class="status" id="labelCount"></span>
  <div class="tabs">
    <button id="tabQuery" class="active" onclick="showTab('query')">Query &amp; Label</button>
    <button id="tabAnalysis" onclick="showTab('analysis')">Analysis</button>
  </div>
</header>

<main>
  <section id="viewQuery">
    <div class="querybar">
      <input type="text" id="imageUrl" placeholder="Paste a card image URL (eBay CDN etc.) — or upload a file →">
      <label class="filebtn" for="fileInput">Upload image</label>
      <input type="file" id="fileInput" accept="image/*" style="display:none">
      <label>top_k <input type="number" id="topK" value="100" min="1" max="200"></label>
      <label>floor <input type="number" id="scoreFloor" value="0" min="0" max="1" step="0.05"></label>
      <label>compare
        <select id="compareMode" onchange="toggleLadderInputs()">
          <option value="clip">CLIP</option>
          <option value="adaptive">DINO adaptive</option>
          <option value="none">none</option>
        </select>
      </label>
      <span id="ladderInputs" style="display:none">
        <label>p1 start <input type="number" id="p1Start" value="0.99" min="0" max="1" step="0.005"></label>
        <label>p1 stop <input type="number" id="p1Stop" value="0.95" min="0" max="1" step="0.005"></label>
        <label>ladder floor <input type="number" id="ladderFloor" value="0.85" min="0" max="1" step="0.005"></label>
      </span>
      <button id="goBtn" onclick="runQuery()">Search</button>
    </div>

    <div class="queryimg" id="queryImg" style="display:none"></div>
    <div class="err" id="queryErr"></div>

    <div class="savebar" id="saveBar" style="display:none">
      <span class="counts">Labeled: <b class="g" id="nGood">0</b> good / <b class="b" id="nBad">0</b> bad
        / <span id="nUn">0</span> unlabeled</span>
      <button id="saveBtn" onclick="saveLabels()">Save labels</button>
      <span class="saved" id="savedMsg"></span>
      <span class="hint">Hover a card and click <b>boundary</b> to mark it and everything above as good,
        everything below as bad. Click any card to toggle its label.</span>
    </div>

    <div class="cols" id="cols" style="display:none">
      <div class="col">
        <h2>DINOv2 — <span id="dinoMeta"></span></h2>
        <div class="grid" id="dinoGrid"></div>
      </div>
      <div class="col" id="clipCol">
        <h2><span id="refTitle">CLIP (reference, adaptive ladder)</span> — <span id="clipMeta"></span></h2>
        <div class="dim" id="overlapLine" style="margin-bottom:6px"></div>
        <div class="grid" id="clipGrid"></div>
      </div>
    </div>
  </section>

  <section id="viewAnalysis" style="display:none">
    <div class="panel">
      <h2>Suggested DINOv2 ladder <button class="filebtn" style="float:right" onclick="loadAnalysis()">Refresh</button></h2>
      <div id="analysisBody" class="dim">Loading…</div>
    </div>
  </section>
</main>

<script>
let current = null;   // { query_id, image_ref, results: [{os_id, score, good|null, ...}] }

async function checkHealth() {
  try {
    const h = await (await fetch('/api/health')).json();
    const ok = h.worker && h.worker.status === 'ok';
    document.getElementById('workerDot').className = 'dot ' + (ok ? 'ok' : 'err');
    document.getElementById('workerTxt').textContent =
      ok ? `worker ok — ${Number(h.worker.qdrant_points).toLocaleString()} pts` : 'worker unreachable';
    document.getElementById('labelCount').textContent = `${h.labeled_queries} labeled queries`;
  } catch (e) {
    document.getElementById('workerDot').className = 'dot err';
    document.getElementById('workerTxt').textContent = 'ui server error';
  }
}

function showTab(t) {
  document.getElementById('viewQuery').style.display = t === 'query' ? '' : 'none';
  document.getElementById('viewAnalysis').style.display = t === 'analysis' ? '' : 'none';
  document.getElementById('tabQuery').className = t === 'query' ? 'active' : '';
  document.getElementById('tabAnalysis').className = t === 'analysis' ? 'active' : '';
  if (t === 'analysis') loadAnalysis();
}

document.getElementById('fileInput').addEventListener('change', () => {
  const f = document.getElementById('fileInput').files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    window._uploadB64 = rd.result.split(',')[1];
    document.getElementById('imageUrl').value = '';
    document.getElementById('imageUrl').placeholder = `uploaded: ${f.name} — hit Search`;
    runQuery();
  };
  rd.readAsDataURL(f);
});

async function runQuery() {
  const url = document.getElementById('imageUrl').value.trim();
  const b64 = url ? null : window._uploadB64;
  const err = document.getElementById('queryErr');
  err.textContent = '';
  if (!url && !b64) { err.textContent = 'Provide an image URL or upload a file.'; return; }

  const btn = document.getElementById('goBtn');
  btn.disabled = true; btn.textContent = 'Searching…';
  try {
    const body = {
      top_k: +document.getElementById('topK').value,
      score_floor: +document.getElementById('scoreFloor').value,
      compare: document.getElementById('compareMode').value,
      ladder: {
        phase1_start: +document.getElementById('p1Start').value,
        phase1_stop: +document.getElementById('p1Stop').value,
        score_floor: +document.getElementById('ladderFloor').value,
      },
    };
    if (url) body.image_url = url; else body.image_b64 = b64;
    const r = await fetch('/api/query', { method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) { err.textContent = j.error || `HTTP ${r.status}`; return; }
    render(j, url, b64);
  } catch (e) { err.textContent = String(e); }
  finally { btn.disabled = false; btn.textContent = 'Search'; }
}

function imgTag(res) {
  // CDN thumbnail first; dead/missing CDN images fall back to the S3 archive
  // proxy (/api/thumb), then to a dimmed placeholder if neither exists.
  const gallery = (res.doc && res.doc.galleryURL) || '';
  const srcHint = (res.payload && (res.payload.index_type || res.payload.source)) || '';
  // Archive keys use the document's numeric `id` field, not the OS _id/os_id.
  const lookupId = (res.doc && res.doc.id != null) ? res.doc.id : res.os_id;
  const proxy = `/api/thumb/${encodeURIComponent(String(lookupId))}?src=${encodeURIComponent(srcHint)}`;
  const first = gallery || proxy;
  return `<img src="${first}" loading="lazy"
      data-proxy="${proxy}" ${gallery ? '' : 'data-tried-proxy="1"'}
      onerror="thumbFix(this)">`;
}

function thumbFix(el) {
  if (el.dataset.triedProxy) { el.style.opacity = .15; return; }
  el.dataset.triedProxy = '1';
  el.src = el.dataset.proxy;
}

function toggleLadderInputs() {
  const adaptive = document.getElementById('compareMode').value === 'adaptive';
  document.getElementById('ladderInputs').style.display = adaptive ? '' : 'none';
}

function render(j, url, b64) {
  const d = j.dino;
  const ref = j.ref;
  current = {
    query_id: j.query_id, image_ref: j.image_ref,
    results: d.qdrant_results.map(r => ({ ...r, good: null })),
  };
  document.getElementById('savedMsg').textContent = '';

  const refLabel = j.ref_kind === 'dino-adaptive' ? 'adaptive' : 'clip';
  const qi = document.getElementById('queryImg');
  qi.style.display = '';
  const src = url || ('data:image/jpeg;base64,' + b64);
  qi.innerHTML = `<img src="${src}">
    <div class="meta"><b>query ${j.query_id}</b><br>
      dino: encode ${d.encode_ms}ms · qdrant ${d.qdrant_ms}ms · ${d.total} hits<br>
      ${ref ? `${refLabel}: encode ${ref.encode_ms ?? '?'}ms · ${ref.total} hits` : 'compare: skipped'}</div>`;

  document.getElementById('dinoMeta').textContent =
    `${d.total} hits, floor ${d.score_floor}`;
  document.getElementById('cols').style.display = '';
  document.getElementById('cols').className = 'cols' + (ref ? '' : ' single');
  document.getElementById('clipCol').style.display = ref ? '' : 'none';
  document.getElementById('saveBar').style.display = '';

  drawDino();

  if (ref) {
    document.getElementById('refTitle').textContent =
      j.ref_kind === 'dino-adaptive'
        ? `DINOv2 adaptive ladder (threshold ${ref.final_threshold?.toFixed(3)}, ${ref.qdrant_calls} qdrant calls)`
        : 'CLIP (reference, adaptive ladder)';
    document.getElementById('clipMeta').textContent = `${ref.total} hits`;

    const ov = document.getElementById('overlapLine');
    if (j.ref_kind === 'dino-adaptive') {
      const plainIds = new Set(d.qdrant_results.map(r => r.os_id));
      const kept = ref.qdrant_results.filter(r => plainIds.has(r.os_id)).length;
      const added = ref.total - kept;
      ov.textContent = `overlap vs plain top-${d.total}: kept ${kept}, ` +
        `cut ${d.total - kept}, new ${added}` +
        (added ? ' — new results mean the ladder\'s threshold search explored differently' : '');
    } else {
      ov.textContent = '';
    }

    document.getElementById('clipGrid').innerHTML = ref.qdrant_results.map((r, i) => `
      <div class="rcard" style="cursor:default">
        <span class="score">${r.score.toFixed(3)}</span><span class="rank">#${i + 1}</span>
        ${imgTag(r)}
        <div class="info"><div class="title">${(r.doc && r.doc.title) || r.os_id}</div></div>
      </div>`).join('');
  }
}

function drawDino() {
  document.getElementById('dinoGrid').innerHTML = current.results.map((r, i) => `
    <div class="rcard ${r.good === true ? 'good' : r.good === false ? 'bad' : ''}"
         onclick="toggle(${i})">
      <span class="score">${r.score.toFixed(3)}</span><span class="rank">#${i + 1}</span>
      ${imgTag(r)}
      <span class="bnd" onclick="event.stopPropagation(); boundary(${i})">boundary ▾</span>
      <div class="info"><div class="title">${(r.doc && r.doc.title) || r.os_id}</div></div>
    </div>`).join('');
  const g = current.results.filter(r => r.good === true).length;
  const b = current.results.filter(r => r.good === false).length;
  document.getElementById('nGood').textContent = g;
  document.getElementById('nBad').textContent = b;
  document.getElementById('nUn').textContent = current.results.length - g - b;
  document.getElementById('saveBtn').disabled = (g + b) === 0;
}

function toggle(i) {
  const r = current.results[i];
  r.good = r.good === true ? false : r.good === false ? null : true;
  document.getElementById('savedMsg').textContent = '';
  drawDino();
}

function boundary(i) {
  current.results.forEach((r, j) => r.good = j <= i);
  document.getElementById('savedMsg').textContent = '';
  drawDino();
}

async function saveLabels() {
  const labeled = current.results.filter(r => r.good !== null)
    .map(r => ({ os_id: r.os_id, score: r.score, good: r.good }));
  const r = await fetch('/api/label', { method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ query_id: current.query_id, image_ref: current.image_ref,
                           results: labeled }) });
  const j = await r.json();
  if (r.ok) {
    document.getElementById('savedMsg').textContent = '✓ saved';
    document.getElementById('labelCount').textContent = `${j.labeled_queries} labeled queries`;
  } else {
    document.getElementById('savedMsg').textContent = j.error || 'save failed';
  }
}

async function loadAnalysis() {
  const el = document.getElementById('analysisBody');
  el.innerHTML = '<span class="spin">Loading…</span>';
  const a = await (await fetch('/api/analysis')).json();
  if (!a.n_good) {
    el.innerHTML = `<p>${a.message || 'No data yet.'}</p>`;
    return;
  }
  const s = a.suggested_ladder;
  const maxCount = Math.max(...a.histogram.map(b => Math.max(b.good, b.bad)), 1);
  const hlRows = new Set([s.phase1_start, s.phase1_stop, s.floor].map(v => Math.round(v * 50) / 50));

  el.innerHTML = `
    <p class="dim">${a.n_queries} labeled queries — <b style="color:var(--good)">${a.n_good} good</b> /
       <b style="color:var(--bad)">${a.n_bad} bad</b> results.
       Mirrors the CLIP ladder semantics (0.99 / 0.95 / 0.85).</p>
    <div class="ladder">
      <div class="step"><div class="v">${s.phase1_start.toFixed(3)}</div><div class="k">phase-1 start<br>(~CLIP 0.99 · good p90)</div></div>
      <div class="step"><div class="v">${s.phase1_stop.toFixed(3)}</div><div class="k">phase-1 stop<br>(~CLIP 0.95 · good p50)</div></div>
      <div class="step"><div class="v">${s.floor.toFixed(3)}</div><div class="k">floor<br>(~CLIP 0.85 · good p05)</div></div>
    </div>
    <p class="dim">Good percentiles: ${Object.entries(a.good_percentiles).map(([k, v]) => `${k}=${v}`).join(' · ')}
    ${a.bad_percentiles.p95 !== undefined ? `<br>Bad percentiles: ${Object.entries(a.bad_percentiles).map(([k, v]) => `${k}=${v}`).join(' · ')}` : ''}</p>
    <div class="hist">${a.histogram.map(b => `
      <div class="bucket" title="${b.lo.toFixed(2)}–${(b.lo + .05).toFixed(2)}: ${b.good} good, ${b.bad} bad">
        <div class="bar g" style="height:${100 * b.good / maxCount}%"></div>
        <div class="bar b" style="height:${100 * b.bad / maxCount}%"></div>
      </div>`).join('')}</div>
    <div class="histx"><span>0.0</span><span>0.25</span><span>0.5</span><span>0.75</span><span>1.0</span></div>
    <table>
      <tr><th>threshold ≥</th><th>precision</th><th>recall (good kept)</th><th>good kept</th><th>bad kept</th></tr>
      ${a.sweep.map(r => `<tr>
        <td${hlRows.has(r.threshold) ? ' class="hl"' : ''}>${r.threshold.toFixed(2)}</td>
        <td>${r.precision === null ? '—' : r.precision.toFixed(3)}</td>
        <td>${r.recall.toFixed(3)}</td><td>${r.good_kept}</td><td>${r.bad_kept}</td></tr>`).join('')}
    </table>`;
}

checkHealth();
document.getElementById('imageUrl').addEventListener('keydown', e => {
  if (e.key === 'Enter') runQuery();
});
</script>
</body>
</html>
